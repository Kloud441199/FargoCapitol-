<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Fargo Capitol</title>
<script>
  (function(){
    var t = localStorage.getItem("wsc_theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="/css/styles.css">
<style>
.input-icon.has-toggle input{padding-right:46px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--text-dimmer);cursor:pointer;border-radius:8px;padding:0}
.pw-toggle:hover{color:var(--gold-bright);background:rgba(255,255,255,.05)}
.pw-toggle svg{width:18px;height:18px}
.pw-toggle .icon-eye-off{display:none}
.pw-toggle.revealed .icon-eye{display:none}
.pw-toggle.revealed .icon-eye-off{display:block}
</style>
</head>
<body>

<div class="auth-bg"></div>

<button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>

<div class="auth-shell">
  <div class="brand-badge">
    <img src="/wsc-logo.png" alt="Fargo Capitol" style="width: 280px; max-width: 100%; height: auto; margin: 0 auto 20px; display: block;">
  </div>

  <div class="auth-card login-card" style="max-width: 560px;">
    <div id="panel-signup">
      <h1>Create Account</h1>
      <p class="sub">Join Fargo Capitol today.</p>

      <div class="error-box" id="signup-error"></div>

      <form id="signup-form" autocomplete="off">
        <div class="field-row">
          <div class="field">
            <label for="f-fullname">Full Name</label>
            <div class="input-icon">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input id="f-fullname" placeholder="John Doe" required>
            </div>
          </div>
          <div class="field">
            <label for="f-username">Username</label>
            <div class="input-icon">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
              <input id="f-username" placeholder="johndoe" required>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="f-email">Email Address</label>
          <div class="input-icon">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            <input id="f-email" type="email" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="f-password">Password</label>
            <div class="input-icon has-toggle">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="f-password" type="password" placeholder="••••••••" minlength="10" required>
<button type="button" class="pw-toggle" data-target="f-password" aria-label="Show password">
  <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
</button>
            </div>
          </div>
          <div class="field">
            <label for="f-confirm">Confirm Password</label>
            <div class="input-icon has-toggle">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="f-confirm" type="password" placeholder="••••••••" minlength="10" required>
<button type="button" class="pw-toggle" data-target="f-confirm" aria-label="Show password">
  <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
</button>
            </div>
          </div>
        </div>

        <div class="form-row-between" style="margin-top: 10px;">
          <label class="check">
            <input type="checkbox" id="f-agree" required>
            <span class="box"></span>
            I agree to the Terms & Privacy Policy
          </label>
        </div>

        <button class="btn btn-solid btn-block" type="submit" id="signup-submit" style="margin-top: 14px;">Create Account →</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script>
document.getElementById("signup-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const errorBox = document.getElementById("signup-error");
  errorBox.style.display = "none";

  const pw = document.getElementById("f-password").value;
  const confirm = document.getElementById("f-confirm").value;
  
  if (pw !== confirm) {
    errorBox.textContent = "Passwords do not match.";
    errorBox.style.display = "block";
    return;
  }

  const btn = document.getElementById("signup-submit");
  btn.disabled = true;
  btn.textContent = "Creating account…";

  try {
    const data = await Api.request("/auth/signup", {
      method: "POST",
      body: JSON.stringify({
        full_name: document.getElementById("f-fullname").value,
        username: document.getElementById("f-username").value,
        email: document.getElementById("f-email").value,
        password: pw,
        confirm_password: confirm,
      }),
    });
    
    Api.setToken(data.token);
    Api.setUser(data.user);
    
    // Redirect to dashboard on success
    window.location.href = "dashboard.html"; 

  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Create Account →";
  }
});
</script>
<script>
document.querySelectorAll(".pw-toggle").forEach(function(btn){
  btn.addEventListener("click",function(){
    var field=document.getElementById(btn.dataset.target);
    if(!field)return;
    var show=field.type==="password";
    field.type=show?"text":"password";
    btn.classList.toggle("revealed",show);
    btn.setAttribute("aria-label",show?"Hide password":"Show password");
  });
});
</script>
</body>
          </html>
