<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCL // ROOT_ACCESS</title>
<style>
:root{--term-green:#0f0;--term-dark:#000;--term-dim:#008800;--neon-green:#00FF41}
body{margin:0;padding:0;background:var(--term-dark);color:var(--term-green);font-family:'Courier New',Courier,monospace;overflow-x:hidden;overflow-y:hidden}
#preloader{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 1s cubic-bezier(.22,1,.36,1)}
#preloader.fade-out{opacity:0;pointer-events:none}
.typing-container{text-align:center}.typing-text{font-size:2.2rem;font-weight:900;color:var(--neon-green);text-shadow:0 0 10px var(--neon-green),0 0 20px var(--neon-green),0 0 40px var(--neon-green),0 0 80px var(--neon-green);letter-spacing:2px}
.cursor{display:inline-block;width:18px;height:2.2rem;background:var(--neon-green);vertical-align:bottom;animation:blink .8s step-end infinite;box-shadow:0 0 10px var(--neon-green)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#matrix-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;opacity:.15}
.admin-container{max-width:1000px;margin:0 auto;padding:20px;position:relative;z-index:1;opacity:0;transition:opacity .5s ease}
.admin-container.show{opacity:1}
.header{border-bottom:2px solid var(--term-green);padding-bottom:10px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;text-shadow:0 0 5px var(--term-green)}
.terminal-box{border:1px solid var(--term-green);background:rgba(0,0,0,.9);padding:15px;margin-bottom:20px;box-shadow:0 0 10px rgba(0,255,0,.2)}
.terminal-box h2{margin-top:0;font-size:16px;border-bottom:1px dashed var(--term-dim);padding-bottom:5px;text-shadow:0 0 3px var(--term-green)}
.log-line{font-size:12px;margin-bottom:4px;color:var(--term-dim);word-break:break-all}.log-line .highlight{color:var(--term-green)}
.table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;min-width:500px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--term-dim)}
th{color:var(--term-green);text-transform:uppercase;text-shadow:0 0 3px var(--term-green)}td{color:var(--neon-green)}
.action-btn{background:transparent;color:var(--term-green);border:1px solid var(--term-green);padding:4px 8px;font-family:inherit;cursor:pointer}
.action-btn:hover{background:var(--term-green);color:var(--term-dark);box-shadow:0 0 10px var(--term-green)}
.blink{animation:blink-anim 1s step-end infinite}@keyframes blink-anim{50%{opacity:0}}
@media(max-width:600px){.typing-text{font-size:1.5rem}.admin-container{padding:12px}.header{font-size:12px}}
</style>
</head>
<body>
<div id="preloader"><div class="typing-container"><span class="typing-text" id="typing-text"></span><span class="cursor" id="cursor"></span></div></div>
<canvas id="matrix-canvas"></canvas>
<div class="admin-container" id="admin-dashboard">
  <div class="header"><div>root@fargocapitol:~# ACCESS_GRANTED</div><div class="blink">█</div></div>
  <div class="terminal-box">
    <h2>[ SYSTEM_LOGS ]</h2>
    <div id="system-logs">
      <div class="log-line">[OK] Initializing kernel module...</div>
      <div class="log-line"><span class="highlight">[OK] Database connection established to FargoCapitol.</span></div>
      <div class="log-line">[OK] Waiting for incoming requests...</div>
    </div>
  </div>
  <div class="terminal-box">
    <h2>[ USER_DATABASE ]</h2>
    <div class="table-wrapper">
      <table><thead><tr><th>ID</th><th>EMAIL</th><th>ROLE</th><th>BALANCE</th><th>ACTION</th></tr></thead>
      <tbody id="user-table-body"><tr><td colspan="5" style="text-align:center">[ FETCHING DATA... ]</td></tr></tbody></table>
    </div>
  </div>
</div>
<script>
const textToType="Kloud Kodes😈";
const typingTextEl=document.getElementById("typing-text");
const preloaderEl=document.getElementById("preloader");
const dashboardEl=document.getElementById("admin-dashboard");
let charIndex=0;
function typeEffect(){
  if(charIndex<textToType.length){typingTextEl.textContent+=textToType.charAt(charIndex);charIndex++;setTimeout(typeEffect,150)}
  else{setTimeout(()=>{preloaderEl.classList.add("fade-out");document.body.style.overflowY="auto";dashboardEl.classList.add("show");setTimeout(()=>{preloaderEl.style.display="none"},1000)},1000)}
}
window.addEventListener("load",()=>setTimeout(typeEffect,300));
const canvas=document.getElementById("matrix-canvas");
const ctx=canvas.getContext("2d");
let drops=[];
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+{}|:<>?~";
const fontSize=14;
function resizeCanvas(){
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  drops=Array.from({length:Math.ceil(canvas.width/fontSize)},()=>1);
}
window.addEventListener("resize",resizeCanvas);resizeCanvas();
function drawMatrix(){
  ctx.fillStyle="rgba(0,0,0,0.05)";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#0F0";ctx.font=fontSize+"px monospace";
  for(let i=0;i<drops.length;i++){
    const character=letters.charAt(Math.floor(Math.random()*letters.length));
    ctx.fillText(character,i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize>canvas.height&&Math.random()>.975)drops[i]=0;
    drops[i]++;
  }
}
setInterval(drawMatrix,50);
function addLog(message,isError){
  const line=document.createElement("div");
  line.className="log-line"+(isError?"":" highlight");
  line.textContent=message;
  document.getElementById("system-logs").appendChild(line);
}
async function loadUsers(){
  const token=localStorage.getItem("wsc_token");
  if(!token){
    document.body.innerHTML="<h1 style='color:red;text-align:center;margin-top:20vh;font-family:monospace'>ACCESS DENIED. PLEASE LOGIN.</h1>";
    return;
  }
  try{
    const res=await fetch("/api/admin/users",{headers:{"Authorization":"Bearer "+token}});
    if(res.status===401||res.status===403){
      document.body.innerHTML="<h1 style='color:red;text-align:center;margin-top:20vh;font-family:monospace'>ACCESS DENIED. ADMINISTRATOR ACCESS REQUIRED.</h1>";
      return;
    }
    if(!res.ok)throw new Error("Could not load user records");
    const users=await res.json();
    const tbody=document.getElementById("user-table-body");
    tbody.replaceChildren();
    if(!users.length){
      const row=tbody.insertRow();const cell=row.insertCell();cell.colSpan=5;cell.textContent="[ NO USERS FOUND ]";
    }
    users.forEach(user=>{
      const row=tbody.insertRow();
      [user.id,user.email,"["+(user.role||"user").toUpperCase()+"]","$"+Number(user.balance||0).toFixed(2)].forEach(value=>{
        const cell=row.insertCell();cell.textContent=String(value);
      });
      const actionCell=row.insertCell();
      const button=document.createElement("button");button.className="action-btn";button.type="button";button.textContent="VIEW";
      button.disabled=true;button.title="User editing is not enabled";
      actionCell.appendChild(button);
    });
    addLog("[SUCCESS] Fetched "+users.length+" user records.",false);
  }catch(error){
    const tbody=document.getElementById("user-table-body");tbody.replaceChildren();
    const row=tbody.insertRow();const cell=row.insertCell();cell.colSpan=5;cell.style.color="red";cell.style.textAlign="center";cell.textContent="[ ERROR: FAILED TO LOAD USERS ]";
    addLog("[ERROR] "+error.message,true);
  }
}
loadUsers();
</script>
</body>
</html>
